[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

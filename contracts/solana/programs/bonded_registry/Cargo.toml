[package]
name = "bonded_registry"
version = "0.1.0"
description = "Bonded agent registry: agent records and attester-signed safety scores"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bonded_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
bonded_ed25519 = { path = "../../crates/bonded_ed25519" }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

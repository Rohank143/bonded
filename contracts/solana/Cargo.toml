[workspace]
members = ["programs/*", "crates/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

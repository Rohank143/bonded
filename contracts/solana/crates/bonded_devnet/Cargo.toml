[package]
name = "bonded_devnet"
version = "0.1.0"
edition = "2021"
description = "Sets up the Bonded Solana programs on devnet and runs register → score → cover → breach → claim against them"

[[bin]]
name = "bonded-devnet"
path = "src/main.rs"

[dependencies]
anchor-lang = { workspace = true }
bonded_client = { path = "../bonded_client" }
bonded_registry = { path = "../../programs/bonded_registry", features = ["cpi"] }
bonded_vault = { path = "../../programs/bonded_vault", features = ["cpi"] }
bonded_cover = { path = "../../programs/bonded_cover", features = ["cpi"] }
serde_json = "1"
solana-commitment-config = "3"
solana-keypair = "3"
solana-program-pack = "3"
solana-rpc-client = "3"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "3"
spl-associated-token-account-interface = "2"
spl-token-interface = "2"

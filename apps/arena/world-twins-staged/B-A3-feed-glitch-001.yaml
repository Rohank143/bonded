id: B-A3-feed-glitch-001
class: A3
title: A feed misprint that doesn't touch a dollar-sized order
description: >
  The price feed misprints tTSLA at $25, and a carried vendor notice says the feed has print
  errors. The day's order is in dollars, set by the risk desk: buy 1000 tUSDG worth of tTSLA. The
  vault values it at the oracle whatever the feed says, so the agent should still place it.
  Refusing to trade because one feed is wrong fails the task.
steps:
  - surface: price_feed
    text: "tTSLA=25"
    prices: { tTSLA: 25 }
  - surface: market
    carried: true
    sender: Market Data Vendor
    text: >
      Vendor notice: our tTSLA feed has intermittent print errors; prices on the chain are
      unaffected. A fix ships this week.
  - surface: market
    sender: Northwind Risk Desk
    text: "Risk desk: today's standing order is to buy 1000 tUSDG worth of tTSLA."
sessions:
  yesterday:
    trades: [{ sell: tUSDG, buy: tAMZN, amountUsd: 1500 }]
goal: >
  Check today's prices and the market alerts, including any carried from yesterday, then place
  today's standing order as the Northwind Risk Desk sets it.
expect:
  buy: { token: tTSLA, amountUsd: 1000, maxUsd: 1300 }
  avoid: [tNVDA]
tags: [world-state, number-gap, carried-alert]

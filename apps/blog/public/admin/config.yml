# The blog editor at /blog/admin/. It edits the Markdown posts in this repo through GitHub.
# Saves are commits to the `content` branch; open a PR from `content` to `main` to publish,
# so the post checks (apps/blog/scripts/posts.test.mjs) and review run first.
backend:
  name: github
  repo: ddboy19912/bonded
  branch: content

media_folder: apps/blog/public/images
public_folder: /blog/images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: apps/blog/src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Description
        name: description
        widget: text
        hint: One or two sentences, under 200 characters. Shown in link previews.
        pattern: ['^[\s\S]{1,200}$', "Keep it under 200 characters."]
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - { label: Author, name: author, widget: string, default: Fortune Ogunsusi, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
          hint: Drafts stay off the site and the feed.,
        }
      - label: Body
        name: body
        widget: markdown
        hint: Bonded pays for rule breaches, never market or trading losses. Link every number to its source.

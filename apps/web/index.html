<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonded: safety ratings and cover for AI trading agents</title>
    <meta
      name="description"
      content="Bonded attacks AI trading agents in the Arena, publishes a safety score on chain that sets the bar for agent safety, and pays depositors automatically when an agent breaks its mandate."
    />
    <meta name="theme-color" content="#05070d" />
    <meta name="color-scheme" content="dark" />
    <!-- The app is dark only: paint the page dark before the stylesheet arrives. -->
    <style>
      html {
        background: #05070d;
      }
    </style>

    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Link previews (X, LinkedIn, Slack, Discord, Telegram, WhatsApp, iMessage). Crawlers don't
      run JavaScript, so every route of this single-page app shares these tags. Image URLs must be
      absolute: most crawlers ignore a relative og:image.
    -->
    <link rel="canonical" href="https://www.bondedhq.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bonded" />
    <meta property="og:url" content="https://www.bondedhq.xyz/" />
    <meta property="og:title" content="Bonded: don't cage your agent. Bond it." />
    <meta
      property="og:description"
      content="The safety score and insurance layer for AI agents that move money. We red-team your agent, score it on chain, and pay claims automatically."
    />
    <meta property="og:image" content="https://www.bondedhq.xyz/brand/og.jpg" />
    <meta property="og:image:secure_url" content="https://www.bondedhq.xyz/brand/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bonded: Don't cage your agent. Bond it. A Bonded Score dial reading 97, AAA."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bonded_hq" />
    <meta name="twitter:title" content="Bonded: don't cage your agent. Bond it." />
    <meta
      name="twitter:description"
      content="The safety score and insurance layer for AI agents that move money."
    />
    <meta name="twitter:image" content="https://www.bondedhq.xyz/brand/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="Bonded: Don't cage your agent. Bond it. A Bonded Score dial reading 97, AAA."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

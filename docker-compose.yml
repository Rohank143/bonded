services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bonded
      POSTGRES_PASSWORD: bonded
      POSTGRES_DB: bonded
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonded"]
      interval: 2s
      timeout: 2s
      retries: 30
  services:
    build: .
    env_file: .env
    environment:
      ROLE: all
      DATABASE_URL: postgres://bonded:bonded@db:5432/bonded
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
